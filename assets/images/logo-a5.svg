<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Modern geometric A5 icon - simple and readable at small sizes -->
  <defs>
    <linearGradient id="a5Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect x="5" y="5" width="90" height="90" rx="18" fill="url(#a5Gradient)"/>
  
  <!-- Stylized "A" shape - simplified for small size readability -->
  <path d="M 30 75 L 35 60 L 50 30 L 50 30 L 65 60 L 70 75 L 60 75 L 57 65 L 43 65 L 40 75 Z" fill="white" stroke="white" stroke-width="1"/>
  <path d="M 47 55 L 53 55 L 50 45 Z" fill="url(#a5Gradient)"/>
  
  <!-- "5" badge in bottom right -->
  <circle cx="75" cy="75" r="12" fill="white" opacity="0.95"/>
  <text x="75" y="80" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">5</text>
</svg>

