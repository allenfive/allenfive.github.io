<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Simplified A5 favicon - optimized for small sizes -->
  <defs>
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="url(#faviconGradient)"/>
  
  <!-- Simplified "A" shape for small size -->
  <path d="M 10 24 L 12 18 L 16 8 L 20 18 L 22 24 L 19 24 L 18 20 L 14 20 L 13 24 Z" fill="white"/>
  <path d="M 15 17 L 17 17 L 16 14 Z" fill="url(#faviconGradient)"/>
  
  <!-- "5" badge -->
  <circle cx="25" cy="25" r="4" fill="white" opacity="0.95"/>
  <text x="25" y="27" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#2563eb" text-anchor="middle">5</text>
</svg>

