# Basic identity
title: A5 Productivity Tools
masthead_title: A5 Productivity Tools
description: Productivity tools - Chrome extensions and custom development solutions
url: "https://allenfive.com"
baseurl: ""

# Language & Locale
lang: en
locale: en-US

# Author
author:
  name: "A5 Productivity Tools"
  email: sales@allenfive.com

# SEO & Social
site:
  logo: /assets/images/logo-a5.png
  og_image: /assets/images/logo-a5.png

# Twitter (add username if you have one)
twitter:
  username: # Add your Twitter username here if applicable
  card: summary_large_image

# Logo configuration
logo: /assets/images/logo-a5.png

# Theme + plugins
theme: minimal-mistakes-jekyll
plugins:
  - jekyll-include-cache

# Theme look & behavior
minimal_mistakes_skin: "default"   # try: "dark", "air", "contrast", "neon", "mint"
search: true
breadcrumbs: true
# paginate: 5
# paginate_path: /page:num/

# Footer configuration
footer:
  links:
    - label: "Privacy"
      url: /docs/privacy/
    - label: "Terms"
      url: /terms/
    - label: "DMCA"
      url: /docs/dmca/
    - label: "Refunds"
      url: /docs/refund/
    - label: "Contact"
      url: mailto:sales@allenfive.com

# Disable RSS feed link in footer
atom_feed:
  hide: true

# Collections
collections:
  products:
    output: true
    permalink: /products/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: products
    values:
      layout: single
      classes: wide